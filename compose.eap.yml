services:
  iris:
    image: iris-community:2026.3.0AI.154.0
    pull_policy: never
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "127.0.0.1:52773:52773"
    entrypoint:
      - /bin/sh
      - -lc
      - >-
        iris start IRIS &&
        trap 'iris stop IRIS quietly; exit 0' TERM INT;
        while :; do sleep 1; done
    volumes:
      - ./:/opt/routeguard:ro
